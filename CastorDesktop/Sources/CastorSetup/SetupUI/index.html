<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Castor Setup</title>
<link rel="stylesheet" href="setup.css">
</head>
<body>
<aside class="side">
  <div class="stars" id="stars"></div>
  <svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="90 90 844 844" aria-hidden="true">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" stop-color="#3a3fb8"/><stop offset="0.55" stop-color="#232674"/><stop offset="1" stop-color="#14163f"/></linearGradient>
 <radialGradient id="glow" cx="0.43" cy="0.55" r="0.42"><stop offset="0" stop-color="#8e92ff" stop-opacity="0.55"/><stop offset="1" stop-color="#8e92ff" stop-opacity="0"/></radialGradient>
 <linearGradient id="big" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c9ccff"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd27a"/><stop offset="1" stop-color="#e7a93b"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.28"/></filter>
 <filter id="soft"><feGaussianBlur stdDeviation="10"/></filter>
 <clipPath id="clip"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
</defs>
<rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
<g clip-path="url(#clip)">
 <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
 <path d="M250 250 Q250 260 260 260 Q250 260 250 270 Q250 260 240 260 Q250 260 250 250 Z" fill="#c9ccff" opacity="0.55"/><path d="M330 693 Q330 700 337 700 Q330 700 330 707 Q330 700 323 700 Q330 700 330 693 Z" fill="#c9ccff" opacity="0.55"/><path d="M760 771 Q760 780 769 780 Q760 780 760 789 Q760 780 751 780 Q760 780 760 771 Z" fill="#c9ccff" opacity="0.55"/><path d="M700 224 Q700 230 706 230 Q700 230 700 236 Q700 230 694 230 Q700 230 700 224 Z" fill="#c9ccff" opacity="0.55"/><path d="M800 413 Q800 420 807 420 Q800 420 800 427 Q800 420 793 420 Q800 420 800 413 Z" fill="#c9ccff" opacity="0.55"/><path d="M260 514 Q260 520 266 520 Q260 520 260 526 Q260 520 254 520 Q260 520 260 514 Z" fill="#c9ccff" opacity="0.55"/><path d="M560 815 Q560 820 565 820 Q560 820 560 825 Q560 820 555 820 Q560 820 560 815 Z" fill="#c9ccff" opacity="0.55"/>
 <path d="M440 320 Q440 570 690 570 Q440 570 440 820 Q440 570 190 570 Q440 570 440 320 Z" fill="#a9adff" opacity="0.45" filter="url(#soft)"/>
 <path d="M440 330 Q440 570 680 570 Q440 570 440 810 Q440 570 200 570 Q440 570 440 330 Z" fill="url(#big)"/>
 <path d="M700 212 Q700 330 818 330 Q700 330 700 448 Q700 330 582 330 Q700 330 700 212 Z" fill="url(#gold)"/>
</g>
<rect x="100.5" y="100.5" width="823" height="823" rx="185" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
</svg>
  <h1>Castor</h1>
  <p data-t="tagline">画像1枚から、動くデスクトップキャラクターを。</p>
  <ol class="steps" id="steps">
    <li data-step="welcome" data-t="step.welcome">ようこそ</li>
    <li data-step="license" data-t="step.license">ライセンス</li>
    <li data-step="details" data-t="step.details">導入の前に</li>
    <li data-step="install" data-t="step.install">インストール</li>
    <li data-step="done" data-t="step.done">完了</li>
  </ol>
  <div class="version" id="version"></div>
</aside>

<main class="main">
  <section class="page" data-page="welcome">
    <h2 data-t="welcome.title">Castor へようこそ</h2>
    <p class="lead" data-t="welcome.lead"></p>
    <p class="status" id="status"></p>
    <button class="link" id="welcomeHistory" data-t="welcome.history">更新内容を見る</button>
  </section>

  <section class="page hidden" data-page="license">
    <h2 data-t="license.title">ライセンス</h2>
    <p class="lead" data-t="license.lead"></p>
    <div class="tabs" id="licenseTabs" data-tab="app">
      <button class="on" data-tab="app" data-t="license.app">Castor</button>
      <button data-tab="notices" data-t="license.notices">第三者のライセンス</button>
    </div>
    <div class="scroll" id="licenseText"></div>
    <label class="check"><input type="checkbox" id="agree"><span data-t="license.agree">ライセンスに同意します</span></label>
  </section>

  <section class="page hidden" data-page="details">
    <h2 data-t="details.title">導入の前に</h2>
    <ul class="points">
      <li><div><b data-t="details.where">保存先</b><span class="path" id="installPath"></span><br><span data-t="details.where.text"></span></div></li>
      <li><div><b data-t="details.download"></b><span data-t="details.download.text"></span></div></li>
      <li><div><b data-t="details.ml"></b><span data-t="details.ml.text"></span></div></li>
      <li><div><b data-t="details.data"></b><span data-t="details.data.text"></span></div></li>
      <li><div><b data-t="details.smartscreen"></b><span data-t="details.smartscreen.text"></span></div></li>
      <li><div><b data-t="details.voice"></b><span data-t="details.voice.text"></span></div></li>
    </ul>
  </section>

  <section class="page hidden" data-page="progress">
    <div class="center">
      <div class="spinner"></div>
      <p class="progress-text" id="progressText"></p>
      <div class="bar hidden" id="progressBar"><div class="fill" id="progressFill"></div></div>
      <p class="note" id="progressDetail"></p>
      <p class="note" data-t="install.note"></p>
    </div>
  </section>

  <section class="page hidden" data-page="done">
    <div class="center">
      <div class="done-mark">✓</div>
      <h2 id="doneTitle"></h2>
      <p class="lead" id="doneLead"></p>
      <p class="note" id="doneNote"></p>
    </div>
  </section>

  <section class="page hidden" data-page="manage">
    <h2 data-t="manage.title">Castor の管理</h2>
    <p class="status installed" id="manageStatus"></p>
    <div class="actions">
      <button class="card" data-action="install"><b data-t="manage.update"></b><span data-t="manage.update.text"></span></button>
      <button class="card" data-action="launch" data-needs-app><b data-t="manage.launch"></b><span data-t="manage.launch.text"></span></button>
      <button class="card" data-action="repair" data-needs-app><b data-t="manage.repair"></b><span data-t="manage.repair.text"></span></button>
      <button class="card" data-action="cleanup" data-needs-app><b data-t="manage.cleanup"></b><span data-t="manage.cleanup.text"></span></button>
      <button class="card danger" data-action="remove" data-needs-app><b data-t="manage.remove"></b><span data-t="manage.remove.text"></span></button>
      <button class="card" data-action="history"><b data-t="manage.history"></b><span data-t="manage.history.text"></span></button>
    </div>
    <p class="section-title" data-t="manage.helper"></p>
    <div class="actions">
      <button class="card" data-action="install" data-component="neuralTTS"><b data-t="helper.install"></b><span data-t="helper.install.text"></span></button>
      <button class="card" data-action="launch" data-component="neuralTTS" data-needs-helper><b data-t="helper.launch"></b><span data-t="helper.launch.text"></span></button>
      <button class="card" data-action="repair" data-component="neuralTTS" data-needs-helper><b data-t="helper.repair"></b><span data-t="helper.repair.text"></span></button>
      <button class="card danger" data-action="remove" data-component="neuralTTS" data-needs-helper><b data-t="helper.remove"></b><span data-t="helper.remove.text"></span></button>
    </div>
    <p class="section-title" data-t="manage.feelings"></p>
    <div class="actions">
      <button class="card" data-action="install" data-component="feelings"><b data-t="feelings.install"></b><span data-t="feelings.install.text"></span></button>
      <button class="card" data-action="repair" data-component="feelings" data-needs-feelings><b data-t="feelings.repair"></b><span data-t="feelings.repair.text"></span></button>
      <button class="card danger" data-action="remove" data-component="feelings" data-needs-feelings><b data-t="feelings.remove"></b><span data-t="feelings.remove.text"></span></button>
    </div>
  </section>

  <section class="page hidden" data-page="history">
    <h2 data-t="history.title">更新履歴</h2>
    <p class="lead" id="historyStatus"></p>
    <div class="scroll history" id="historyList"></div>
  </section>

  <section class="page hidden" data-page="error">
    <div class="center">
      <div class="done-mark error-mark">!</div>
      <h2 data-t="error.title"></h2>
      <p class="lead" id="errorText"></p>
    </div>
  </section>

  <footer class="footer" id="footer"></footer>
</main>

<div class="modal hidden" id="confirm">
  <div class="box">
    <h3 id="confirmTitle"></h3>
    <p id="confirmText" data-t="confirm.remove.text"></p>
    <div class="row">
      <button class="button" id="confirmNo" data-t="cancel">キャンセル</button>
      <button class="button primary" id="confirmYes" data-t="remove">削除する</button>
    </div>
  </div>
</div>
<div class="toast hidden" id="toast"></div>

<script src="setup.js"></script>
</body>
</html>
