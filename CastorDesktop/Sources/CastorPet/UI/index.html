<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Castor</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="glow glow-a"></div>
<div class="glow glow-b"></div>

<header class="top">
  <div class="segmented" id="modeSwitch" role="tablist">
    <button role="tab" data-mode="ai" data-t="Setting with AI">AIで設定</button>
    <button role="tab" data-mode="rig" class="on" data-t="Rigging">リギング</button>
  </div>
  <div class="round-buttons">
    <button class="round" id="libraryButton" data-title="My Pets" title="ペット一覧">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg>
    </button>
    <button class="round" id="voiceButton" data-title="Voice" title="声">
      <svg viewBox="0 0 24 24"><path d="M4 10v4M8 7v10M12 4v16M16 8v8M20 11v2" /></svg>
    </button>
    <button class="round" id="settingsButton" data-title="Settings" title="設定">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.6M12 18.6v2.6M21.2 12h-2.6M5.4 12H2.8M18.5 5.5l-1.8 1.8M7.3 16.7l-1.8 1.8M18.5 18.5l-1.8-1.8M7.3 7.3 5.5 5.5"/></svg>
    </button>
  </div>
</header>

<main class="stage">
  <section class="canvas glass" id="canvas">
    <div class="empty" id="emptyState">
      <svg class="empty-icon" viewBox="0 0 48 40"><rect x="3" y="5" width="34" height="27" rx="5"/><circle cx="13" cy="14" r="3.5"/><path d="M5 30l10-10 7 7 5-4 8 7"/><circle cx="38" cy="30" r="8" class="plus-bg"/><path d="M38 26v8M34 30h8" class="plus"/></svg>
      <h1 data-t="Image Rigging">画像からペットを作成</h1>
      <p data-t="Import an illustration to create a starter rig.">イラストを読み込んで基本リグを作成してください。</p>
      <p class="hint" data-t="drop.hint">ここに画像をドラッグしても読み込めます</p>
    </div>

    <div class="review hidden" id="reviewState">
      <div class="figure" id="figure">
        <img id="preview" alt="">
        <div id="markers"></div>
      </div>
      <aside class="side">
        <div class="chip" id="estimatorChip"></div>
        <p class="side-title" data-t="Check the face markers before rigging.">リギングの前に顔マーカーを確認してください。</p>
        <ul class="legend" id="legend"></ul>
        <ul class="warnings" id="warnings"></ul>
      </aside>
    </div>

    <div class="library hidden" id="libraryState">
      <div class="library-head">
        <h2 data-t="My Pets">ペット一覧</h2>
        <button class="tool accent" id="newPetButton"><span data-t="library.new">＋ 新しく作る</span></button>
      </div>
      <div class="pet-grid" id="petGrid"></div>
      <p class="library-empty hidden" id="libraryEmpty" data-t="library.empty">まだペットがありません。画像を読み込んで作ってみましょう。</p>
      <p class="hint" data-t="library.hint">選ぶとデスクトップのペットが入れ替わります。削除したペットはごみ箱に移ります。</p>
    </div>

    <div class="busy hidden" id="busy">
      <div class="spinner"></div>
      <p id="busyText"></p>
      <button class="ghost" id="cancelButton" data-t="Cancel">キャンセル</button>
    </div>

    <div class="drop-overlay hidden" id="dropOverlay"><span data-t="drop.release">ここで離すと読み込みます</span></div>
  </section>

  <nav class="toolbar glass">
    <div class="tools">
      <button class="tool accent" id="importButton">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="10" r="1.8"/><path d="M4 18l6-5 4 3 3-2 3 3"/></svg>
        <span data-t="Import Image">画像を読み込む</span>
      </button>
      <button class="tool" id="adjustButton" disabled>
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="9" cy="10" r="1"/><circle cx="15" cy="10" r="1"/><path d="M9 15c1.7 1.4 4.3 1.4 6 0"/></svg>
        <span data-t="Adjust Face">顔を調整</span>
      </button>
      <button class="tool" id="saveButton" disabled>
        <svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5"/><path d="M5 19h14"/></svg>
        <span data-t="Save Pet">ペットを保存</span>
      </button>
      <button class="tool" disabled title="">
        <svg viewBox="0 0 24 24"><rect x="3" y="6" width="12" height="12" rx="2.5"/><rect x="9" y="3" width="12" height="12" rx="2.5"/></svg>
        <span data-t="Add Quality View">Quality用の画像を追加</span>
      </button>
    </div>
    <div class="segmented small" id="kindSwitch">
      <button class="on" data-kind="standard">Standard</button>
      <button data-kind="quality2d" disabled>2D Quality</button>
      <button data-kind="quality3d" disabled>3D Quality</button>
    </div>
  </nav>
</main>

<div class="modal hidden" id="confirmDelete">
  <div class="modal-box glass">
    <h3 data-t="library.deleteTitle">このペットを削除しますか？</h3>
    <p data-t="library.deleteText">ペットのファイルをごみ箱に移します。ごみ箱から元に戻せます。</p>
    <div class="modal-row">
      <button class="ghost" id="deleteNo" data-t="Cancel">キャンセル</button>
      <button class="ghost danger" id="deleteYes" data-t="library.delete">削除する</button>
    </div>
  </div>
</div>
<div class="modal hidden" id="renameDialog">
  <div class="modal-box glass">
    <h3 data-t="library.renameTitle">ペットの名前</h3>
    <input class="text-input" id="renameInput" maxlength="40" autocomplete="off">
    <div class="modal-row">
      <button class="ghost" id="renameNo" data-t="Cancel">キャンセル</button>
      <button class="ghost danger" id="renameYes" data-t="library.renameSave">保存</button>
    </div>
  </div>
</div>
<div class="toast hidden" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
