name: CastorCore checks

on:
  pull_request:
    paths:
      - "CastorCore/**"
      - ".github/workflows/castor-core-check.yml"
  push:
    paths:
      - "CastorCore/**"
      - ".github/workflows/castor-core-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Run CastorCore tests
        run: swift test --package-path CastorCore

  linux:
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Run CastorCore tests
        run: swift test --package-path CastorCore

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Swift
        uses: compnerd/gha-setup-swift@main
        with:
          branch: swift-6.2-release
          tag: 6.2-RELEASE

      - name: Run CastorCore tests
        run: swift test --package-path CastorCore
