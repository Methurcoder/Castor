name: CastorCore checks

on:
  pull_request:
    paths:
      - "CastorCore/**"
      - ".github/workflows/castor-core-check.yml"
  push:
    paths:
      - "CastorCore/**"
      - ".github/workflows/castor-core-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Swift
        uses: compnerd/gha-setup-swift@main
        with:
          branch: swift-6.2-release
          tag: 6.2-RELEASE

      - name: Keep only the diagnostics
        shell: pwsh
        run: Remove-Item CastorCore/Tests/CastorCoreTests/CastorCoreTests.swift

      - name: Run CastorCore tests
        run: swift test --package-path CastorCore --filter WindowsConnectDiagnostics
