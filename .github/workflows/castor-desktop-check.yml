name: CastorDesktop checks
on:
  pull_request:
    paths: ["CastorDesktop/**", "Arils/**", "CastorCore/**", "download/**", "scripts/prepare-castor-release.py", "scripts/build-castor-setup.py", "scripts/build-castor-app.py", "scripts/build-castor-windows-models.py", "scripts/windows_neural_tts_server.py", "scripts/build-castor-neural-helper.py", "scripts/tests/**", ".github/workflows/castor-desktop-check.yml"]
  push:
    paths: ["CastorDesktop/**", "Arils/**", "CastorCore/**", "download/**", "scripts/prepare-castor-release.py", "scripts/build-castor-setup.py", "scripts/build-castor-app.py", "scripts/build-castor-windows-models.py", "scripts/windows_neural_tts_server.py", "scripts/build-castor-neural-helper.py", "scripts/tests/**", ".github/workflows/castor-desktop-check.yml"]
  workflow_dispatch:
    inputs:
      build_release_candidate:
        description: Build Windows app and Qwen helper candidate artifacts (no Release)
        type: boolean
        default: false
      candidate_version:
        description: Candidate version
        type: string
        default: v0.3.0-beta.1
      build_neural_helper:
        description: Build the optional Windows GUI helper without downloading models
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: compnerd/gha-setup-swift@bbae8ce86bac5a3449f3992b3d88bc4ca25f2057 # pinned setup-swift
        with:
          swift-version: swift-6.4.1-release
          swift-build: 6.4.1-RELEASE
      - name: Test portable archive loading and rendering
        run: swift test --package-path CastorDesktop --scratch-path "$env:RUNNER_TEMP/CastorDesktop"
      - name: Check packaging and Windows downloader offline
        run: python scripts/tests/test_castor_distribution.py
      - name: Check loopback Neural TTS without model downloads
        run: python scripts/tests/test_windows_neural_tts.py
      - name: Build the actual Win32 release executable
        run: swift build --package-path CastorDesktop --scratch-path "$env:RUNNER_TEMP/CastorDesktop" -c release --product CastorPet
      - name: Build and collect the GUI installer runtime locally
        run: python scripts/build-castor-setup.py --output "$env:RUNNER_TEMP/CastorSetupRuntime" --scratch "$env:RUNNER_TEMP/CastorDesktop"
      - name: Open the setup wizard and wait for its page (WebView2)
        timeout-minutes: 3
        run: |
          $process = Start-Process "$env:RUNNER_TEMP/CastorSetupRuntime/CastorSetup.exe" -ArgumentList '--check-ui' -Wait -PassThru -NoNewWindow
          Get-Content "$env:LOCALAPPDATA/Castor/Logs/setup.log" -ErrorAction SilentlyContinue
          if ($process.ExitCode -ne 0) { throw "The setup wizard page did not become ready (exit $($process.ExitCode))." }
      - name: Collect app runtime with its in-app GUI setup entry
        shell: pwsh
        run: |
          $bin = swift build --package-path CastorDesktop --scratch-path "$env:RUNNER_TEMP/CastorDesktop" -c release --show-bin-path
          python -c "import importlib.util,pathlib; s=importlib.util.spec_from_file_location('bundle','scripts/build-castor-setup.py'); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); o=pathlib.Path(r'$env:RUNNER_TEMP/CastorAppRuntime'); o.mkdir(); m.windows_runtime(['CastorPet.exe','CastorSetup.exe'],o,pathlib.Path(r'$bin'),[])"
      - name: Exercise native ZIP extraction with the collected installer
        run: |
          $env:CASTOR_SETUP_EXE = "$env:RUNNER_TEMP/CastorSetupRuntime/CastorSetup.exe"
          python scripts/tests/test_castor_distribution.py DistributionTests.test_gui_setup_native_extraction_handles_spaces_unicode_and_quotes
  macos:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - run: swift test --package-path CastorDesktop
      - name: Check packaging and native Mac downloader offline
        run: python3 scripts/tests/test_castor_distribution.py
      - name: Check loopback Neural TTS without model downloads
        run: python3 scripts/tests/test_windows_neural_tts.py
      - name: Build a Finder-launchable GUI setup app locally
        run: python3 scripts/build-castor-setup.py --output "$RUNNER_TEMP/CastorSetupRuntime" --scratch "$RUNNER_TEMP/CastorSetupBuild" --arch arm64

  neural-helper:
    if: github.event_name == 'workflow_dispatch' && inputs.build_neural_helper
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Prepare an isolated CPU helper build environment
        shell: pwsh
        run: |
          python -m venv "$env:RUNNER_TEMP/NeuralBuild"
          $py = "$env:RUNNER_TEMP/NeuralBuild/Scripts/python.exe"
          & $py -m pip install --disable-pip-version-check "torch==2.9.1" "torchaudio==2.9.1" --index-url https://download.pytorch.org/whl/cpu
          & $py -m pip install --disable-pip-version-check "qwen-tts==0.1.1" "pyinstaller==6.22.3"
      - name: Bundle GUI and Python runtime without model weights
        shell: pwsh
        run: python scripts/build-castor-neural-helper.py --python "$env:RUNNER_TEMP/NeuralBuild/Scripts/python.exe" --output "$env:RUNNER_TEMP/CastorNeuralCandidate"
      - name: Load packaged dependencies without the build environment
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot/System32;$env:SystemRoot"
          Remove-Item Env:PYTHONHOME -ErrorAction SilentlyContinue
          Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue
          $result = "$env:RUNNER_TEMP/neural-dependencies.json"
          $process = Start-Process "$env:RUNNER_TEMP/CastorNeuralCandidate/CastorNeuralTTS.exe" -ArgumentList '--self-check', $result -Wait -PassThru
          if ($process.ExitCode -ne 0) { Get-Content $result -ErrorAction SilentlyContinue; throw 'Packaged helper could not load its dependencies.' }
          $report = Get-Content $result | ConvertFrom-Json
          if (-not $report.ready -or $report.modelsLoaded) { throw 'Invalid dependency-check result.' }
          $report | ConvertTo-Json

  windows-qwen-candidate:
    if: github.event_name == 'workflow_dispatch' && inputs.build_release_candidate
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CASTOR_CANDIDATE_VERSION: ${{ inputs.candidate_version }}
    steps:
      - uses: actions/checkout@v6
      - uses: compnerd/gha-setup-swift@bbae8ce86bac5a3449f3992b3d88bc4ca25f2057
        with:
          swift-version: swift-6.4.1-release
          swift-build: 6.4.1-RELEASE
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test shared rigging and installer behavior
        run: swift test --package-path CastorDesktop --scratch-path "$env:RUNNER_TEMP/CastorDesktop"
      - name: Test packaging and speech contracts without model downloads
        run: |
          python scripts/tests/test_castor_distribution.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/tests/test_windows_neural_tts.py
      - name: Build app and GUI setup with required runtime DLLs
        run: python scripts/build-castor-app.py --output "$env:RUNNER_TEMP/CastorApp" --scratch "$env:RUNNER_TEMP/CastorAppBuild"
      - name: Add the ML models (ONNX exports at pinned weights) and ONNX Runtime
        run: |
          python -m venv "$env:RUNNER_TEMP/ModelBuild"
          $py = "$env:RUNNER_TEMP/ModelBuild/Scripts/python.exe"
          & $py -m pip install --disable-pip-version-check "torch==2.14.1" "torchvision==0.29.1" --index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $py -m pip install --disable-pip-version-check "anime-face-detector==0.1.0" "onnx==1.23.2" "onnxruntime==1.31.0" "numpy==2.5.4" "pillow==12.3.0" "safetensors==0.8.0" "opencv-python-headless==5.0.0.93"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $py scripts/build-castor-windows-models.py --app "$env:RUNNER_TEMP/CastorApp"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare isolated CPU speech build environment
        run: |
          python -m venv "$env:RUNNER_TEMP/NeuralBuild"
          $py = "$env:RUNNER_TEMP/NeuralBuild/Scripts/python.exe"
          & $py -m pip install --disable-pip-version-check "torch==2.9.1" "torchaudio==2.9.1" --index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $py -m pip install --disable-pip-version-check "qwen-tts==0.1.1" "pyinstaller==6.22.3"
      - name: Bundle optional speech GUI without weights
        run: python scripts/build-castor-neural-helper.py --python "$env:RUNNER_TEMP/NeuralBuild/Scripts/python.exe" --output "$env:RUNNER_TEMP/CastorSpeech"
      - name: Load packaged dependencies with developer PATH removed
        run: |
          $env:PATH = "$env:SystemRoot/System32;$env:SystemRoot"
          Remove-Item Env:PYTHONHOME -ErrorAction SilentlyContinue
          Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue
          $report = "$env:RUNNER_TEMP/speech-check.json"
          $process = Start-Process "$env:RUNNER_TEMP/CastorSpeech/CastorNeuralTTS.exe" -ArgumentList '--self-check', $report -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Packaged speech dependency check failed' }
          $check = Get-Content $report | ConvertFrom-Json
          if (-not $check.ready -or $check.modelsLoaded) { throw 'Invalid dependency report' }
      - name: Prepare local candidate ZIPs and integrity manifest
        run: |
          python scripts/prepare-castor-release.py --version "$env:CASTOR_CANDIDATE_VERSION" --output "$env:RUNNER_TEMP/CastorCandidate" --windows-x86-64 "$env:RUNNER_TEMP/CastorApp" --setup-windows-x86-64 "$env:RUNNER_TEMP/CastorAppBuild/gui-setup-candidate" --neural-helper-windows-x86-64 "$env:RUNNER_TEMP/CastorSpeech"
      - name: Save candidate for real device verification (not a public Release)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-qwen-candidate
          path: ${{ runner.temp }}/CastorCandidate/
          retention-days: 7
          if-no-files-found: error
