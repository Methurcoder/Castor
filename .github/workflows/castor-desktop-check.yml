name: CastorDesktop checks
on:
  pull_request:
    paths: ["CastorDesktop/**", "Arils/**", "CastorCore/**", "download/**", "scripts/prepare-castor-release.py", "scripts/build-castor-setup.py", "scripts/tests/test_castor_distribution.py", ".github/workflows/castor-desktop-check.yml"]
  push:
    paths: ["CastorDesktop/**", "Arils/**", "CastorCore/**", "download/**", "scripts/prepare-castor-release.py", "scripts/build-castor-setup.py", "scripts/tests/test_castor_distribution.py", ".github/workflows/castor-desktop-check.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: compnerd/gha-setup-swift@bbae8ce86bac5a3449f3992b3d88bc4ca25f2057 # pinned setup-swift
        with:
          swift-version: swift-6.4.1-release
          swift-build: 6.4.1-RELEASE
      - name: Test portable archive loading and rendering
        run: swift test --package-path CastorDesktop --scratch-path "$env:RUNNER_TEMP/CastorDesktop"
      - name: Check packaging and Windows downloader offline
        run: python scripts/tests/test_castor_distribution.py
      - name: Build the actual Win32 release executable
        run: swift build --package-path CastorDesktop --scratch-path "$env:RUNNER_TEMP/CastorDesktop" -c release --product CastorPet
      - name: Build and collect the GUI installer runtime locally
        run: python scripts/build-castor-setup.py --output "$env:RUNNER_TEMP/CastorSetupRuntime" --scratch "$env:RUNNER_TEMP/CastorDesktop"
      - name: Exercise native ZIP extraction with the collected installer
        run: |
          $env:CASTOR_SETUP_EXE = "$env:RUNNER_TEMP/CastorSetupRuntime/CastorSetup.exe"
          python scripts/tests/test_castor_distribution.py DistributionTests.test_gui_setup_native_extraction_handles_spaces_unicode_and_quotes
  macos:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - run: swift test --package-path CastorDesktop
      - name: Check packaging and native Mac downloader offline
        run: python3 scripts/tests/test_castor_distribution.py
      - name: Build a Finder-launchable GUI setup app locally
        run: python3 scripts/build-castor-setup.py --output "$RUNNER_TEMP/CastorSetupRuntime" --scratch "$RUNNER_TEMP/CastorSetupBuild" --arch arm64
